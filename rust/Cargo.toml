[package]
name = "rust"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
android_logger = "0.15.1"
espeak-ng = { version = "0.1.1", features = ["bundled-data"] }
log = "0.4.29"
ndarray = "0.17.2"
tinyaudio = "2.0.0"
ort = "2.0.0-rc.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[build-dependencies]
cbindgen = "0.29.0"

[lib]
crate-type = ["staticlib", "cdylib"]
