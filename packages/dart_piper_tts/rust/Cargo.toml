[package]
name = "dart_piper_tts_native"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
log = "0.4.29"
ndarray = "0.17.2"
ort = "2.0.0-rc.12"
ringbuf = "0.4.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tinyaudio = "2.0.0"
tokenizers = { version = "0.23.1", features = ["onig", "esaxx_fast"] }

[build-dependencies]
cbindgen = "0.29.0"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

[target.'cfg(any(target_os = "ios"))'.dependencies]
oslog = { version = "0.2.0", features = ["logger"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
env_logger = "0.11.10"

[lib]
crate-type = ["staticlib", "cdylib"]
